{% load static %}<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Вопросы
{% endblock %} · AskSpace</title>
<link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
<link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
<link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
<header>
<div class="shell topbar">
<a class="brand" href="{% url 'questions:index' %}">AskSpace
</a>
<form class="search" action="{% url 'questions:index' %}" method="get" role="search">
<label class="visually-hidden" for="search">Поиск вопросов</label>
<input class="form-control" id="search" name="q" placeholder="Найти вопрос или тему…" value="{{ search|default:'' }}" maxlength="200">
</form>
<a class="btn btn-primary" href="{% url 'questions:ask' %}">Задать вопрос</a>
<nav class="account" aria-label="Аккаунт">{% if show_user_menu %}<img class="avatar" src="{% static 'img/avatar.svg' %}" alt="">
<a href="{% url 'core:profile' %}">Антон</a>
<a href="{% url 'core:login' %}">Выход</a>{% else %}<a href="{% url 'core:login' %}">Войти</a>
<a href="{% url 'core:signup' %}">Регистрация</a>{% endif %}</nav>
</div>
</header>
<div class="shell layout">
<main id="main">{% block content %}

{% endblock %}</main>
<aside class="sidebar" aria-label="Сообщество">{% include 'includes/sidebar.html' %}</aside>
</div>
<footer><div class="shell">AskSpace — вопросы и ответы</div></footer>
<script src="{% static 'js/bootstrap.bundle.min.js' %}">
</script>
<script src="{% static 'js/main.js' %}">
</script>
</body>
</html>
