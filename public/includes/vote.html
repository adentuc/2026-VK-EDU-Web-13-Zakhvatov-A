<div class="vote" data-vote data-selected="{{ item.selected|default:0 }}" role="group" aria-label="Голосование">
<button type="button" data-value="1" aria-label="Нравится" aria-pressed="{% if item.selected == 1 %}true{% else %}false{% endif %}">▲</button>
<output aria-live="polite">{{ item.rating }}</output>
<button type="button" data-value="-1" aria-label="Не нравится" aria-pressed="{% if item.selected == -1 %}true{% else %}false{% endif %}">▼</button>
</div>
