{% load static %}<article class="question-card">{% include 'includes/vote.html' with item=question %}<div class="question-body">
<a class="question-title" href="{% url 'questions:question' question.id %}">{{ question.title }}</a>
<p class="excerpt">{{ question.text|truncatechars:180 }}</p>
<div>{% for tag in question.tags %}<a class="tag" href="{% url 'questions:tag' tag %}">{{ tag }}</a>{% endfor %}</div>
<div class="meta">
<img class="avatar" src="{% static 'img/avatar.svg' %}" alt="">
<span>{{ question.author }}</span>
<span>· {{ question.created|date:'d.m.Y H:i' }}</span>
<a class="answer-count" href="{% url 'questions:question' question.id %}">Ответов: {{ question.answer_count }}</a>
</div>
</div>
</article>
